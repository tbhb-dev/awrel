---
# Main quality gate. Bazel pins every tool and owns every gate: the
# hermetic checks are cached `bazel test` targets, so `bazel test //...`
# runs them all, and the few that need the network, Git history or the
# GitHub API run as their own steps after it. A final `conclusion` job gives
# branch protection one stable required check.
#
# On main, the deploy workflow runs these same jobs before it deploys,
# rather than reacting to this workflow's result.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bazel 9.x only, the version .bazelversion pins, on Linux (x86_64 and
  # arm64), macOS (arm64) and Windows (x86_64). The Worker's targets carry
  # the "worker" tag and run on Linux only: the Worker runs on Cloudflare's
  # Linux-based runtime, so no other OS adds coverage. The checks that need
  # the network or GitHub's API run on Linux only; they do not depend on the
  # OS.
  bazel:
    name: "bazel (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
        include:
          - os: ubuntu-26.04
            release: release
            filters: ""
          - os: ubuntu-26.04-arm
            release: release
            filters: ""
          - os: macos-26
            release: release
            filters: --build_tag_filters=-worker --test_tag_filters=-worker
          # Bazel runs the workspace status command without a shell on
          # Windows, so the release config there uses the batch script.
          - os: windows-2025
            release: release-windows
            filters: --build_tag_filters=-worker --test_tag_filters=-worker
    defaults:
      run:
        shell: bash
    steps:
      # Full history: the release build stamps the version from the tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Hardening (Linux), Bazel and its caches, Windows' Bash, output root
      # and long paths, Linux arm64's Rust, and the retried fetch of //...
      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@f752be685b3a3ceb8232a472cc69b188b20dd65a  # main
        with:
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      # //... is every hermetic gate: the whole-tree lint tests (secrets in
      # the working tree, YAML, TOML, Markdown, prose, EditorConfig,
      # workflows, shell, CODEOWNERS paths), the format check, Starlark
      # lint, nogo during the build, the Go and Python tests and linters,
      # the Worker's TypeScript checks and workerd tests (Linux only), the
      # coverage floors, the docs bundle and REUSE checks, the import
      # contracts, and the preset staleness test.
      - name: Test
        env:
          FILTERS: ${{ matrix.filters }}
        # FILTERS is either empty or a list of flags, split into words.
        run: |
          read -ra filters <<<"${FILTERS}"
          bazelisk test --config=ci "${filters[@]}" //...

      # Keep passing timings visible too; failed sessions also print stacks.
      - name: Windows log file timings
        if: always() && matrix.os == 'windows-2025'
        run: |
          for log in .bazel-testlogs/{cmd/awrel/awrel,internal/logfile/logfile}_test/test.log; do
            if [[ -f "$log" ]]; then
              cat "$log"
            fi
          done

      - name: Build the release binary
        env:
          RELEASE_CONFIG: ${{ matrix.release }}
        run: bazelisk build "--config=${RELEASE_CONFIG}" //cmd/awrel

      # A failed run's test logs, so a failure that does not recur can still
      # be read.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs-${{ matrix.os }}
          path: |
            .bazel-testlogs/**/test.log
            .bazel-testlogs/**/test.xml
          # upload-artifact skips dot-prefixed paths otherwise.
          include-hidden-files: true
          if-no-files-found: ignore

  # The repository-level checks, on Linux beside the bazel matrix, so they
  # don't wait behind the tests. rules' reusable workflow runs gazelle, the
  # MODULE.bazel tidy check, the history scan, the dependency audits, the
  # Go vulnerability scan, zizmor online and the CODEOWNERS check.
  repo:
    name: repo
    permissions:
      contents: read
    uses: tbhb-dev/rules/.github/workflows/repo-checks.yml@f752be685b3a3ceb8232a472cc69b188b20dd65a  # main
    with:
      timeout-minutes: 10
      pip-audit-target: //tools:pip_audit
      govulncheck-target: //:govulncheck
      gazelle-dirs: .
      module-dirs: .

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed. It passes only when every needed job's
  # result is exactly "success", so a gate that was skipped, cancelled or
  # never finished cannot pass. A matrix with a cancelled leg reports
  # "abandoned", not "cancelled", so the check lists what passes, not what
  # fails.
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        uses: tbhb-dev/rules/.github/actions/ci-conclusion@f752be685b3a3ceb8232a472cc69b188b20dd65a  # main
        with:
          needs: ${{ toJSON(needs) }}
