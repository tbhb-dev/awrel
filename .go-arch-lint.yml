---
# Import contracts: the command sits on the internal packages. The chain,
# leaf first, is protocol, transport, relayclient; compact is a leaf; delivery
# builds on compact and protocol, and mcpserver on delivery and protocol.
# persist builds on protocol; the command wires it to relayclient.
# internal/buildmeta imports nothing of the module. Every package must belong
# to a component.
version: 3

allow:
  depOnAnyVendor: false
  deepScan: false  # deep scanning runs the go command; the test has none

components:
  cmd: {in: cmd/*}
  buildmeta: {in: internal/buildmeta}
  protocol: {in: internal/protocol}
  transport: {in: internal/transport}
  relayclient: {in: internal/relayclient}
  compact: {in: internal/compact}
  delivery: {in: internal/delivery}
  mcpserver: {in: internal/mcpserver}
  persist: {in: internal/persist}

vendors:
  windows: {in: [golang.org/x/sys/windows]}
  cobra: {in: [github.com/spf13/cobra, github.com/spf13/cobra/**]}
  mcpsdk: {in: [github.com/modelcontextprotocol/go-sdk/mcp, github.com/modelcontextprotocol/go-sdk/jsonrpc]}
  websocket: {in: [github.com/coder/websocket, github.com/coder/websocket/**]}

deps:
  cmd:
    mayDependOn: [buildmeta, protocol, transport, relayclient, mcpserver, persist]
    canUse: [cobra, websocket]  # its tests' fake relay accepts with coder/websocket
  buildmeta:
    mayDependOn: [buildmeta]  # a leaf; go-arch-lint rejects an empty list
  protocol:
    mayDependOn: [protocol]  # a leaf
  transport:
    mayDependOn: [protocol]
    canUse: [websocket]
  relayclient:
    mayDependOn: [protocol, transport]
    canUse: [websocket]  # its tests' fake relay accepts with coder/websocket
  compact:
    mayDependOn: [compact]  # a leaf
  delivery:
    mayDependOn: [compact, protocol]
  mcpserver:
    mayDependOn: [delivery, protocol]
    canUse: [mcpsdk]
  persist:
    mayDependOn: [protocol]
    canUse: [windows]
